<!doctype html>
<html lang="ru" class="html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alexander Taimasov</title>
    <meta name="description" content="Alexander Taimasov" />
    <link rel="icon" type="image/svg+xml" href="./favicons/favicon.svg" />
    <link rel="stylesheet" type="text/css" href="./reset.css" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Alexander Taimasov" />
    <meta property="og:title" content="Alexander Taimasov" />
    <meta property="og:description" content="Alexander Taimasov" />
    <meta
      property="og:image"
      content="https://avatars.githubusercontent.com/u/136252899"
    />
  </head>

  <body class="body smooth-mesh-background">
    <header class="header">
      <div class="header__container">
        <div class="header__copyrights copyrights">
          <a
            href="https://github.com/ATaimasov"
            target="_blank"
            class="link copyrights__link"
          >
            <img
              src="./img/copyrights.svg"
              alt="copyrights"
              class="logo copyrights__logo"
            />
          </a>
        </div>

        <nav class="nav header__nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a href="/" class="link">Main</a>
            </li>
            <li class="nav__item">
              <a href="https://github.com/ATaimasov" class="link">About</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main" x-data="">
      <div class="main__container bg">
        <section class="section">
          <div class="section__container">
            <h1 class="section__title">Alpine Components</h1>
            <p class="section__text">Easy way to make</p>
          </div>
        </section>

        <!-- COMPONENTS -->
        <section class="section input-fields">
          <div
            class="input-field"
            x-t="COMPONENTS.input('name', 'storeExample')"
          ></div>
          <div
            class="input-field"
            x-t="COMPONENTS.input('subname', 'storeExample')"
          ></div>
        </section>

        <div
          class="checkbox-field"
          x-t="COMPONENTS.checkbox('checkbox', 'storeExample')"
        ></div>
        <!-- ARRAY INSIDE SCHEMA -->
        <div
          class="radio-group"
          x-t="COMPONENTS.radio('choise', 'storeExample')"
        ></div>

        <section class="section field-infos">
          <div
            class="field-info"
            x-t="COMPONENTS.storageFieldInfo('name', 'storeExample')"
          ></div>
          <div
            class="field-info"
            x-t="COMPONENTS.storageFieldInfo('subname', 'storeExample')"
          ></div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="footer__container">
        <p>all rights reserved</p>
      </div>
    </footer>

    <script src="./x-t.js"></script>
    <script src="./scripts.js"></script>
    <script src="./alpinejs@3.15.8.min.js"></script>
  </body>
</html>
